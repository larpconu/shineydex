name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compat:
    name: Compile against Cobblemon ${{ matrix.cobblemon }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cobblemon: ["1.6.1+1.21.1", "1.8.2+1.21.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew compileJava -Pcobblemon_version=${{ matrix.cobblemon }} --stacktrace

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: shinydex-jar
          path: build/libs/shinydex-*+1.21.1.jar
      - name: Publish jar to the "latest" release
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/heads/claude/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Shiny Dex (latest build)
          body: |
            Shiny Dex for Minecraft 1.21.1 (Fabric) + Cobblemon.
            Download `shinydex-*.jar` below and put it in your `mods` folder next to Cobblemon and Fabric API.
          prerelease: false
          make_latest: true
          files: build/libs/shinydex-*+1.21.1.jar
